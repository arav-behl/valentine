<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            position: relative;
        }

        .floating-hearts {
            position: fixed;
            pointer-events: none;
        }

        .heart {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            animation: float 3s ease-in infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(20px);
                opacity: 0;
            }
        }

        h1 {
            font-size: 3rem;
            color: #e91e63;
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #764ba2;
            margin-bottom: 50px;
            font-weight: 300;
        }

        .buttons-container {
            display: flex;
            gap: 100px;
            justify-content: center;
            align-items: center;
            min-height: 120px;
            position: relative;
            width: 100%;
        }

        button {
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.2rem;
            transition: all 0.2s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        #yesButton {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 25px 80px;
            font-size: 1.8rem;
            animation: pulse 2s ease-in-out infinite;
            flex-shrink: 0;
        }

        #yesButton:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(245, 87, 108, 0.4);
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        #noButton {
            background: #e0e0e0;
            color: #666;
            padding: 8px 16px;
            font-size: 0.9rem;
            position: relative;
            pointer-events: all;
            flex-shrink: 0;
        }

        #noButton:hover {
            background: #d0d0d0;
        }

        .heart-emoji {
            display: inline-block;
            margin: 0 10px;
            font-size: 2.5rem;
            animation: heartbeat 0.6s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.3);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .success-message {
            display: none;
            font-size: 2rem;
            color: #f5576c;
            margin-top: 30px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotateZ(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Will You Be My Valentine? <span class="heart-emoji">💕</span></h1>
        <p class="subtitle">Let me know your answer...</p>

        <div class="buttons-container">
            <button id="yesButton">YES</button>
            <button id="noButton">No</button>
        </div>

        <div class="success-message">
            🎉 Yay! 🎉<br>
            <span style="font-size: 1.5rem;">💕💕💕</span>
        </div>
    </div>

    <script>
        const noButton = document.getElementById('noButton');
        const yesButton = document.getElementById('yesButton');
        const successMessage = document.querySelector('.success-message');

        // Make NO button run away
        noButton.addEventListener('mouseenter', () => {
            const randomX = Math.random() * (window.innerWidth - 150);
            const randomY = Math.random() * (window.innerHeight - 150);

            noButton.style.position = 'fixed';
            noButton.style.left = randomX + 'px';
            noButton.style.top = randomY + 'px';
        });

        // Also work on mobile
        noButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const randomX = Math.random() * (window.innerWidth - 150);
            const randomY = Math.random() * (window.innerHeight - 150);

            noButton.style.position = 'fixed';
            noButton.style.left = randomX + 'px';
            noButton.style.top = randomY + 'px';
        });

        // YES button handler
        yesButton.addEventListener('click', () => {
            successMessage.style.display = 'block';
            noButton.style.display = 'none';
            yesButton.style.display = 'none';
            createConfetti();
            createFloatingHearts();
        });

        // Confetti animation
        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '-10px';
                confetti.style.background = ['#f5576c', '#f093fb', '#ff69b4', '#ff1493'][Math.floor(Math.random() * 4)];
                confetti.style.animation = `confetti-fall ${2 + Math.random() * 1}s ease-in forwards`;
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 3000);
            }
        }

        // Floating hearts
        function createFloatingHearts() {
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.textContent = '💕';
                    heart.style.left = Math.random() * window.innerWidth + 'px';
                    heart.style.top = window.innerHeight + 'px';
                    heart.style.animationDelay = Math.random() * 0.5 + 's';
                    document.body.appendChild(heart);

                    setTimeout(() => heart.remove(), 3500);
                }, i * 100);
            }
        }

        // Initial floating hearts on load
        window.addEventListener('load', () => {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.textContent = '💕';
                    heart.style.left = Math.random() * window.innerWidth + 'px';
                    heart.style.top = window.innerHeight + 'px';
                    heart.style.animationDelay = Math.random() * 0.5 + 's';
                    document.body.appendChild(heart);

                    setTimeout(() => heart.remove(), 3500);
                }, i * 200);
            }
        });
    </script>
</body>
</html>
